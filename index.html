<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Login Page</title>
    <link
      rel="icon"
      href="https://static.cdninstagram.com/rsrc.php/yx/r/e5sID2a2l9O.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">    
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-wrapper">
      <div class="left-section">
        <div class="left-content">
          <div class="instagram-logo">
            <img
              src="https://vectorjungal.com/files/preview/1280x1240/11722280372jwbj115hlmmdz2loonab7khnhwuku5cd4icwl78s3xbhclqhzaog3n1kgbsm00yuy0jwqfchfulwgy3n1re5kqhqtukzionrw4z6.png"
              alt="Instagram"
              width="194"
              height="64"
            />
          </div>

          <h1 align="center" class="tagline">
            See everyday moments from your<br />
            <span class="gradient-text">close friends</span>.
          </h1>

          <div class="phone-mockup">
            <img
              src="https://static.cdninstagram.com/rsrc.php/yN/r/-erGonz07kB.webp"
              alt="Instagram app showing everyday moments"
              class="promo-image"
            />
          </div>
        </div>
      </div>

      <div class="right-section">
        <div class="login-container">
          <div class="mobile-logo">
            <img
              src="https://vectorjungal.com/files/preview/1280x1240/11722280372jwbj115hlmmdz2loonab7khnhwuku5cd4icwl78s3xbhclqhzaog3n1kgbsm00yuy0jwqfchfulwgy3n1re5kqhqtukzionrw4z6.png"
              alt="Instagram"
              width="175"
              height="51"
            />
          </div>

          <div class="back-button">
            <svg width="12" height="20" viewBox="0 0 13 17" fill="none" xmlns="http://www.w3.org/2000/svg">
           <path d="M9 2L3 10L9 18" stroke="#262626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
           </svg>
            <span>Log into Instagram</span>
          </div>

          <form class="login-form" action="#" method="POST">
            <div class="input-group">
              <input type="text" id="username" placeholder=" " autocomplete="username" required>
    <label for="username">Mobile number, username or email</label>
            </div>

            <div class="input-group">
              <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
    <label for="password">Password</label>
            </div>

            <button type="submit" class="btn-login">Log in</button>
          </form>

          <div class="forgot-password">
            <a href="https://www.instagram.com/accounts/password/reset/">Forgot password?</a>
          </div>

          <div class="divider">
            <div class="divider-line"></div>
          </div>

          <button class="btn-facebook">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#385185">
              <button class="btn-facebook">
              <i class="fa-brands fa-facebook"></i>
              <a href="https://web.facebook.com/login.php?next=https%3A%2F%2Fwww.facebook.com%2Foidc%2F%3Fapp_id%3D124024574287414%26redirect_uri%3Dhttps%253A%252F%252Fwww.instagram.com%252Faccounts%252Fsignupviafb%252F%26response_type%3Dcode%26scope%3Dopenid%2Bemail%2Bprofile%2Blinking%26state%3DATon3bxs8HPZEC1eByAqkyP-tAztG7eYtVj6lwHsk8TlNdGPOpUn91-vaASSu0-BsVeGxGuKWEFXZCETCNUrjeJaODvpg5o7lrA9BQtyFknLMGcrzgm0zdkGotZmlF8fpQh5fTitV99qTIKUaYUl9NcUFasNghZQMA0IM7lUGtPLBBGgWDTxq4rktaGI_rcULY-w4Fatv5tPZYne8wa-2I2amJE-MC01zufv7bcW_2Y60iizDJ5s8cvBDnEMg4gU7XbAN525cwQIK9DR-kg3OKb93g&_rdc=1&_rdr#">
                Log in with Facebook</a>
              </button>
            </svg>
          </button>

          <button class="btn-signup">
            <a href="https://www.instagram.com/accounts/emailsignup/">Create new account</a>
          </button>

          <div class="meta-logo">
            <svg width="79" height="20" viewBox="0 0 79 20" fill="#0064fe">
              <div class="meta-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Meta_Platforms_Inc._logo.svg" alt="Meta" width="75">
              </div>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <nav class="footer-nav">
        <a href="#">Meta</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
        <a href="#">Jobs</a>
        <a href="#">Help</a>
        <a href="#">API</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Locations</a>

        <a href="#">Meta Verified</a>
        <a href="#">Meta in Indonesia</a>
      </nav>
      <div class="footer-bottom">
        <div class="language-selector-wrapper">
      <select class="language-select" aria-label="Language">
        <option value="af">Afrikaans</option>
        <option value="ar">العربية</option>
        <option value="cs">Čeština</option>
        <option value="da">Dansk</option>
        <option value="de">Deutsch</option>
        <option value="el">Ελληνικά</option>
        <option value="en" selected>English</option>
        <option value="en-gb">English (UK)</option>
        <option value="es">Español (España)</option>
        <option value="es-la">Español</option>
        <option value="fa">فارسی</option>
        <option value="fi">Suomi</option>
        <option value="fr">Français</option>
        <option value="he">עברית</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="it">Italiano</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="nb">Norsk</option>
        <option value="nl">Nederlands</option>
        <option value="pl">Polski</option>
        <option value="pt-br">Português (Brasil)</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
        <option value="sv">Svenska</option>
        <option value="th">ภาษาไทย</option>
        <option value="tl">Filipino</option>
        <option value="tr">Türkçe</option>
        <option value="zh-cn">中文(简体)</option>
        <option value="zh-tw">中文(台灣)</option>
      </select>
      <span class="language-label">English</span>
      <svg class="language-arrow" width="60" height="6" viewBox="0 0 10 5" fill="#8e8e8e">
        <path d="M1 1L5 5L9 1" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
        <span>© 2026 Instagram from Meta</span>
      </div>
    </footer>
  </body>
</html>
